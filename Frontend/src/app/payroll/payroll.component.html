<div class="h-full flex flex-col">
    <div class="flex items-center justify-between p-6">
        <div class="font-bold text-xl text-slate-900 tracking-tighter">Payroll Management</div>
        <button (click)="openPayrollGenerate()"
            class="border border-primary-400 bg-primary-600 p-2 shadow-md shadow-primary-300 text-white rounded-lg space-x-3">
            <i class="fa fa-play text-sm"></i>
            Run Payroll</button>
    </div>
    <div class="grid  lg:grid-cols-2 2xl:grid-cols-3 grid-cols-1 gap-6 p-6">
        <div class="rounded-md border border-primary-400 bg-primary-500 text-white p-4">
            <div class="uppercase text-xs tracking-tighter">Total Disbursement</div>
        </div>
        <div class="rounded-md border border-slate-400 p-4">
            <div class="uppercase text-xs tracking-tighter">Average Salary</div>
        </div>
        <div class="rounded-md border border-slate-400 p-4">
            <div class="uppercase text-xs tracking-tighter">Pending Processing</div>
        </div>
    </div>
    <div class="p-6 flex flex-col flex-1 min-h-0">
        <div class="rounded-md border border-slate-300 p-6 flex flex-col min-h-0">
            <div class="flex items-center justify-between mb-3">
                <div class="font-bold text-sm text-slate-800">Recent Transactions</div>
                <div class="flex gap-2 items-center justify-between">
                    <button
                        class="text-xs font-bold text-emerald-600 hover:text-emerald-700 cursor-pointer flex items-center gap-2">
                        <i class="fa fa-upload"></i>
                        Import CSV
                    </button>
                    <button
                        class="text-xs font-bold text-primary-600 hover:text-primary-700 cursor-pointer flex items-center gap-2">
                        <i class="fa fa-download"></i>
                        Export CSV
                    </button>
                </div>

            </div>
            <div class="flex flex-col flex-1 min-h-0 overflow-auto">
                <table class="w-full border border-slate-100 border-collapse">
                    <thead class="sticky top-0">
                        <tr
                            class="text-left uppercase text-slate-500 tracking-wider text-[12px] border border-slate-100 sticky top-0 bg-slate-100">
                            <th class="py-6 pl-3 w-1/5">Employee</th>
                            <th class="py-6 pl-3 ">Basic</th>
                            <th class="py-6 pl-3">Allowances</th>
                            <th class="py-6 pl-3">Deductions</th>
                            <th class="py-6 pl-3">Net Salary</th>
                            <th class="py-6 pl-3">Status</th>
                            <th class="py-6 pl-3">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let item of payrollData"
                            class="font-bold text-base text-slate-700 border border-slate-100">
                            <td class="py-6 pl-3">
                                <div class="flex gap-2 items-center">
                                    <div
                                        class="w-9 h-9 bg-primary-50 rounded-full border border-primary50 text-primary-700 flex items-center justify-center">
                                        {{item.userName[0]}}</div>
                                    {{item.userName}}
                                </div>
                            </td>
                            <td class="py-6 pl-3 text-slate-400 font-bold">${{item.basicSalary}}</td>
                            <td class="py-6 pl-3 text-green-600 font-bold">+${{item.allowances}}</td>
                            <td class="py-6 pl-3 text-rose-600 font-bold">-${{item.deductions}}</td>
                            <td class="py-6 pl-3 font-bold text-slate-900">{{item.netSalary}}</td>
                            <td class="py-6 pl-3">hii</td>
                            <td class="py-6 pl-3">
                                <button  class="text-slate-400 hover:text-slate-600 transition-colors p-2">
                                    <i class="fa fa-ellipsis-v"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>

               
            </div>
        </div>
    </div>
</div>
<app-payroll-generate *ngIf="isPayrollGenerateOpened" (isCanceled)="isCanceled($event)"></app-payroll-generate>
